name: key-vision-pages
on:
  push:
    branches: [main, cursor/kuiyan-ui-data-landing-65bd]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ship/key-vision
      - id: deployment
        uses: actions/deploy-pages@v4
